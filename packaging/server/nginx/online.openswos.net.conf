# online.openswos.net: the OpenSWOS server's web side (docs/NETPLAY_SETUP.md section 12,
# tools/matchmaker-admin/README.md). The game itself talks to the matchmaker on 19602,
# not here.
server {
    listen 80;
    listen [::]:80;
    server_name online.openswos.net;
    # Plain http only redirects (certbot --nginx adds its own challenge location to renew).
    location / { return 301 https://online.openswos.net$request_uri; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name online.openswos.net;

    ssl_certificate     /etc/letsencrypt/live/online.openswos.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/online.openswos.net/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    add_header Strict-Transport-Security "max-age=31536000" always;
    server_tokens off;

    # Everything here is for us, not the public. Two logins (since 2026-10-26):
    #   the TEAM's (.htpasswd-openswos-team): the recordings and the recordings player
    #     (/playback/, added by scripts/swos-matchmaker-service.sh install) -- to watch,
    #     not to delete, which only the admin page does;
    #   the ADMIN's (.htpasswd-matchmaker-admin): that, and the match reports (both
    #     players' SWOS.log, local addresses included) and the admin page.
    # nginx reads one file per location, so the admin's line is in the team file too:
    # change the admin's password in both. The fetch scripts send the admin's login and
    # then clear what they fetched.
    #   htpasswd -B /etc/nginx/.htpasswd-openswos-team <name>     add a team member
    #   htpasswd -D /etc/nginx/.htpasswd-openswos-team <name>     remove one
    auth_basic "OpenSWOS server";
    auth_basic_user_file /etc/nginx/.htpasswd-openswos-team;

    location = / { auth_basic off; default_type text/plain; return 200 "OpenSWOS online server\n"; }

    include /etc/nginx/snippets/swos-playback.conf;
    location /recordings/ {
        alias /srv/swos-matchmaker/recordings/;
        autoindex on;
        autoindex_exact_size on;    # exact bytes: the fetch scripts delete only a file at the size they fetched
    }

    location /reports/ {
        auth_basic_user_file /etc/nginx/.htpasswd-matchmaker-admin;
        alias /srv/swos-matchmaker/reports/;
        autoindex on;
    }

    # The admin page: an unprivileged gateway on 127.0.0.1:8899.
    location /cc/ {
        auth_basic_user_file /etc/nginx/.htpasswd-matchmaker-admin;
        proxy_pass http://127.0.0.1:8899/;
        proxy_set_header Host $host;
    }

    location / { return 404; }
}
