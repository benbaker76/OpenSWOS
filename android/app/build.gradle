plugins { id 'com.android.application' }
android {
    namespace 'net.openswos'
    compileSdk 35
    ndkVersion '28.2.13676358'
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    defaultConfig {
        applicationId 'net.openswos.test'
        minSdk 26
        targetSdk 35
        versionCode 7
        versionName '0.7-test'
        ndk { abiFilters 'arm64-v8a' }
        externalNativeBuild { ndkBuild { arguments 'APP_PLATFORM=android-26' } }
    }
    sourceSets.main {
        java.srcDir '../../build/android-deps/SDL2-2.32.10/android-project/app/src/main/java'
        assets.srcDir '../../build/android-assets'
    }
    externalNativeBuild { ndkBuild { path 'jni/Android.mk' } }
    buildTypes { debug { jniDebuggable true } }
}
